<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手机主页 + LINE UI (AI聊天+通讯录+ID添加)</title>

    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-image-url: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYNKlqazeIwo7lHEctQ1m-4sA3EuR0tQACASwAAvjGWFc7gBC7Wy2V8D0E.jpeg');
            --widget-bg-url: url('https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYNGRqazRcvjCr2kV4kbBc_xfLUfPldgACqCsAAvjGWFeIpTXSdcVZbD0E.jpeg');
            
            --glass-bg: rgba(255, 252, 248, 0.65);
            --glass-border: rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 24px rgba(210, 185, 175, 0.2);
            
            --text-main: #5c4b43;
            --text-sub: #96837a;
            --radius: 24px;
            --app-icon-filter: none;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
            user-select: none;
        }

        body {
            background-color: #e2d7d0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 375px;
            height: 812px;
            background-image: var(--bg-image-url);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fcebe6;
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15), inset 0 0 0 8px #fff;
            position: relative;
            padding: 16px 20px 24px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px 16px 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 700;
            z-index: 10;
        }
        .status-icons { display: flex; gap: 6px; font-size: 12px; }
        .screen-content { display: flex; flex-direction: column; gap: 16px; }

        .widget {
            border-radius: var(--radius);
            box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .greeting-widget {
            height: 150px;
            padding: 18px 20px;
            position: relative;
            overflow: hidden;
            background-color: rgba(253, 242, 234, 0.7);
            background-image: 
                linear-gradient(to right, rgba(253, 242, 234, 0.9) 35%, rgba(253, 242, 234, 0) 70%),
                var(--widget-bg-url);
            background-repeat: no-repeat;
            background-position: right center;
            background-size: auto 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        .greeting-text { color: var(--text-main); z-index: 2; }
        .greeting-text .subtitle { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
        .greeting-text .subtitle .heart { color: #f7a8b8; }
        .greeting-text .time { font-size: 38px; font-weight: 700; line-height: 1.1; margin: 4px 0; color: #4a3c36; }
        .greeting-text .date { font-size: 12px; color: var(--text-sub); }
        .greeting-text .wish { font-size: 11px; margin-top: 4px; color: var(--text-sub); display: flex; align-items: center; gap: 4px; }

        .weather-widget {
            background: rgba(255, 233, 231, 0.6);
            display: flex; justify-content: space-between; align-items: center; color: var(--text-main); padding: 14px 18px;
        }
        .weather-left { display: flex; align-items: center; gap: 12px; }
        .weather-icon { font-size: 28px; color: #f1b399; }
        .weather-temp { font-size: 22px; font-weight: bold; }
        .weather-city { font-size: 11px; color: var(--text-sub); }
        .weather-forecast { display: flex; gap: 10px; font-size: 11px; text-align: center; }
        .forecast-item { display: flex; flex-direction: column; gap: 2px; }
        .forecast-item i { color: #f1b399; margin: 2px 0; }

        .app-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 12px; margin-top: 4px; justify-items: center;
        }
        .app-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .app-item:active { transform: scale(0.92); }
        .app-name { font-size: 11px; color: var(--text-main); font-weight: 500; }
        
        .app-icon {
            width: 54px; height: 54px; background: var(--glass-bg); backdrop-filter: blur(10px); border-radius: 16px;
            display: flex; justify-content: center; align-items: center; font-size: 24px; box-shadow: var(--glass-shadow);
            border: 1px solid var(--glass-border); position: relative; filter: var(--app-icon-filter);
        }

        .icon-line { color: #06C755 !important; }
        .icon-ins { color: #e8a7c2 !important; }
        .icon-x { color: #5c5552 !important; }
        .icon-setting { color: #a39e9c !important; }
        .icon-contacts { color: #87bba2 !important; }
        .icon-photos { color: #f1bf85 !important; }
        .icon-music { color: #f28d8d !important; }
        .icon-theme { color: #e59866 !important; }
        .icon-memo { color: #e6b17e !important; }
        .icon-calendar { color: #db6b6b !important; }
        .icon-reminders { color: #72b0d7 !important; }
        .icon-other { color: #b58d72 !important; }

        .pagination { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
        .dot { width: 6px; height: 6px; background: rgba(168, 141, 135, 0.3); border-radius: 50%; }
        .dot.active { background: #a88d87; }

        .dock-bar {
            background: rgba(255, 252, 248, 0.55); backdrop-filter: blur(16px); border-radius: 28px; padding: 10px 16px;
            display: flex; justify-content: space-around; box-shadow: var(--glass-shadow); border: 1px solid var(--glass-border);
        }
        .dock-bar .app-icon { box-shadow: none; background: rgba(255, 255, 255, 0.7); }
        
        .home-indicator {
            width: 134px; height: 5px; background: #d8c2bb; border-radius: 3px; margin: 8px auto 0 auto; cursor: pointer;
        }
        .line-home-indicator {
            width: 134px; height: 5px; background: #000000; border-radius: 3px; margin: 6px auto 4px auto; cursor: pointer; opacity: 0.6;
        }
        .line-home-indicator:active { opacity: 1; transform: scaleX(1.05); }

        /* LINE 全屏界面 */
        .line-app-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; z-index: 200; display: flex; flex-direction: column;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }
        .line-app-container.active { transform: translateY(0); }
        .line-status-bar-spacer { height: 38px; width: 100%; background: #fff; flex-shrink: 0; }

        .line-main-viewport { flex: 1; position: relative; overflow: hidden; }
        .line-tab-page {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; background: #fff; overflow-y: auto;
        }
        .line-tab-page.active { display: flex; }

        .line-home-header {
            padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; color: #111;
        }
        .line-header-left { display: flex; align-items: center; gap: 8px; font-size: 18px; cursor: pointer; }
        .line-header-left:active { opacity: 0.5; }
        .line-header-right { display: flex; gap: 16px; font-size: 18px; }
        .line-header-right i { cursor: pointer; }

        .line-profile-card {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 20px 20px 20px; cursor: pointer;
        }
        .line-profile-card:hover { background: #fafafa; }
        .line-profile-info .name { font-size: 22px; font-weight: 800; color: #000; margin-bottom: 2px; }
        .line-profile-info .status-msg { font-size: 13px; color: #8e8e93; }
        .line-profile-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #eee; border: 1px solid #eaeaea; }

        .line-search-bar {
            margin: 0 16px 16px 16px; background: #f2f2f7; border-radius: 18px; padding: 8px 14px;
            display: flex; align-items: center; justify-content: space-between; color: #8e8e93; font-size: 14px;
        }

        .line-section { padding: 0 16px; margin-bottom: 20px; }
        .line-section-title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; color: #000; margin-bottom: 12px; }
        .line-section-title .more { font-size: 12px; color: #8e8e93; font-weight: normal; }

        .line-services-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; text-align: center; }
        .line-service-item { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; }
        .line-service-icon { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #111; display: flex; justify-content: center; align-items: center; font-size: 20px; color: #111; }
        .line-service-name { font-size: 11px; color: #111; font-weight: 500; }

        .line-accordion-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; font-size: 14px; font-weight: 700; color: #000; }

        .line-chat-header { padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; }
        .line-chat-header .title { font-size: 20px; font-weight: 800; color: #000; display: flex; align-items: center; gap: 4px; }
        .line-chat-header .header-icons { display: flex; gap: 16px; font-size: 18px; color: #111; }

        .line-empty-state {
            flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 30px;
        }
        .line-empty-state .title { font-size: 18px; font-weight: 800; color: #000; margin-bottom: 8px; }
        .line-empty-state .subtitle { font-size: 13px; color: #8e8e93; margin-bottom: 20px; line-height: 1.4; }
        .line-empty-btn {
            background: #fff; border: 1px solid #d1d1d6; padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: 700; color: #000; cursor: pointer;
        }

        .line-bottom-nav {
            height: 56px; background: #fafafa; border-top: 1px solid #e5e5e5; display: flex; justify-content: space-around; align-items: center;
        }
        .line-nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8e8e93; cursor: pointer; width: 33%; }
        .line-nav-item.active { color: #000; }
        .line-nav-item i { font-size: 20px; }
        .line-nav-item span { font-size: 10px; font-weight: 500; }

        /* 聊天气泡 */
        .chat-bubble {
            max-width:75%;
            padding:10px 14px;
            border-radius:18px;
            font-size:14px;
            line-height:1.4;
            word-break:break-word;
        }
        .chat-user {
            align-self:flex-end;
            background:#06C755;
            color:white;
            border-bottom-right-radius:4px;
        }
        .chat-ai {
            align-self:flex-start;
            background:#f2f2f7;
            color:#333;
            border-bottom-left-radius:4px;
        }
        .chat-loading {
            color:#999;
            font-size:13px;
            align-self:flex-start;
        }

        /* Modal 弹窗 */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(92, 75, 67, 0.35); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: center;
            z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .settings-card {
            width: 88%; max-height: 88%; overflow-y: auto; background: rgba(255, 250, 245, 0.98);
            border-radius: 28px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); color: var(--text-main); display: flex; flex-direction: column; gap: 12px;
        }
        .settings-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 16px; border-bottom: 1px solid rgba(150, 131, 122, 0.15); padding-bottom: 8px; }
        .close-btn { cursor: pointer; font-size: 18px; color: var(--text-sub); }
        .setting-item { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
        .setting-item label { font-weight: bold; }
        .setting-item select, .setting-item input, .setting-item textarea { padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(150, 131, 122, 0.3); background: rgba(255, 255, 255, 0.85); outline: none; font-size: 12px; }
        .setting-item textarea { resize: none; height: 50px; }
        .input-group { display: flex; gap: 6px; }
        .input-group input, .input-group select { flex: 1; }
        .btn-action { background: #e8a7c2; color: white; border: none; padding: 8px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-save { background: #06C755; color: white; border: none; padding: 10px; border-radius: 16px; font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 4px; }
        .divider { height: 1px; background: rgba(150, 131, 122, 0.15); margin: 2px 0; }

        .friend-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            gap: 14px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.1s;
        }
        .friend-item:hover { background: #fafafa; }
        .friend-avatar {
            width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: #eee;
        }
        .friend-info {
            flex:1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .friend-name {
            font-size: 16px;
            font-weight: 600;
            color: #111;
        }
        .friend-last-msg {
            font-size: 13px;
            color: #8e8e93;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 180px;
        }
        .friend-time {
            font-size: 11px;
            color: #c7c7cc;
        }
        #chat-room-page {
            background:#fff;
        }
        /* 通讯录列表样式 */
        #contact-list .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        #contact-list .contact-item img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }
        #contact-list .contact-item .info {
            flex:1;
        }
        #contact-list .contact-item .info .name {
            font-weight: 600;
            color: #111;
        }
        #contact-list .contact-item .info .id {
            font-size: 12px;
            color: #999;
        }
        /* 添加好友按钮在搜索栏下方 */
        .line-search-bar-wrapper {
            margin: 0 16px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .line-search-bar-wrapper .line-search-bar {
            margin: 0;
        }
        .btn-add-friend-inline {
            background: #06C755;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn-add-friend-inline:active { opacity: 0.7; }
    </style>
</head>
<body>

    <div class="phone-container" id="phone-container">
        <!-- 桌面状态栏 -->
        <div class="status-bar">
            <span id="status-time">23:18</span>
            <div class="status-icons">
                <i class="fa-solid fa-moon"></i>
                <i class="fa-solid fa-signal"></i>
                <i class="fa-solid fa-wifi"></i>
                <i class="fa-solid fa-battery-full"></i>
            </div>
        </div>

        <!-- 桌面主屏 -->
        <div class="screen-content">
            <div class="widget greeting-widget" id="greeting-card">
                <div class="greeting-text">
                    <div class="subtitle"><span id="txt-greeting">晚上好</span> <span class="heart">♥</span></div>
                    <div class="time" id="widget-time">23:18</div>
                    <div class="date" id="widget-date">7月29日 星期二</div>
                    <div class="wish"><span id="txt-wish">今天也要保持微笑哦</span> <i class="fa-regular fa-face-smile" style="font-size: 11px;"></i></div>
                </div>
            </div>

            <div class="widget weather-widget">
                <div class="weather-left">
                    <i class="fa-solid fa-cloud-sun weather-icon"></i>
                    <div>
                        <div class="weather-temp">24°</div>
                        <div class="weather-city">东京 · 多云</div>
                    </div>
                </div>
                <div class="weather-forecast">
                    <div class="forecast-item"><span>周二</span><i class="fa-solid fa-cloud-sun"></i><span>26°</span></div>
                    <div class="forecast-item"><span>周三</span><i class="fa-solid fa-sun"></i><span>25°</span></div>
                    <div class="forecast-item"><span>周四</span><i class="fa-solid fa-cloud"></i><span>24°</span></div>
                    <div class="forecast-item"><span>周五</span><i class="fa-solid fa-cloud-rain"></i><span>22°</span></div>
                </div>
            </div>

            <!-- APP 图标网格 -->
            <div class="app-grid">
                <div class="app-item" id="btn-open-line">
                    <div class="app-icon icon-line"><i class="fa-solid fa-comment-dots"></i></div>
                    <span class="app-name">LINE</span>
                </div>
                <div class="app-item">
                    <div class="app-icon icon-ins"><i class="fa-brands fa-instagram"></i></div>
                    <span class="app-name">Instagram</span>
                </div>
                <div class="app-item">
                    <div class="app-icon icon-x"><svg viewBox="0 0 24 24" style="width:20px;fill:currentColor;"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></div>
                    <span class="app-name">X</span>
                </div>

                <div class="app-item" id="btn-open-settings">
                    <div class="app-icon icon-setting"><i class="fa-solid fa-gear"></i></div>
                    <span class="app-name">设置</span>
                </div>

                <!-- 联系人图标 -->
                <div class="app-item" id="btn-open-contacts">
                    <div class="app-icon icon-contacts"><i class="fa-solid fa-user-group"></i></div>
                    <span class="app-name">联系人</span>
                </div>

                <div class="app-item"><div class="app-icon icon-photos"><i class="fa-solid fa-image"></i></div><span class="app-name">相册</span></div>
                <div class="app-item"><div class="app-icon icon-music"><i class="fa-solid fa-music"></i></div><span class="app-name">音乐</span></div>

                <div class="app-item" id="btn-open-theme">
                    <div class="app-icon icon-theme"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
                    <span class="app-name">美化</span>
                </div>

                <div class="app-item"><div class="app-icon icon-memo"><i class="fa-solid fa-note-sticky"></i></div><span class="app-name">备忘录</span></div>
                <div class="app-item"><div class="app-icon icon-calendar"><i class="fa-solid fa-calendar-day"></i></div><span class="app-name">日历</span></div>
                <div class="app-item"><div class="app-icon icon-reminders"><i class="fa-solid fa-list-check"></i></div><span class="app-name">提醒事项</span></div>
                <div class="app-item"><div class="app-icon icon-other"><i class="fa-solid fa-paw"></i></div><span class="app-name">其他</span></div>
            </div>

            <div class="pagination"><div class="dot active"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
        </div>

        <div>
            <div class="dock-bar">
                <div class="app-item"><div class="app-icon" style="color: #9ccb9e;"><i class="fa-solid fa-phone"></i></div></div>
                <div class="app-item"><div class="app-icon" style="color: #f7a8b8;"><i class="fa-solid fa-envelope"></i></div></div>
                <div class="app-item"><div class="app-icon" style="color: #8dbfe0;"><i class="fa-solid fa-compass"></i></div></div>
                <div class="app-item"><div class="app-icon" style="color: #909090;"><i class="fa-solid fa-camera"></i></div></div>
            </div>
            <div class="home-indicator"></div>
        </div>

        <!-- LINE 应用界面 -->
        <div class="line-app-container" id="line-app">
            <div class="line-status-bar-spacer"></div>

            <div class="line-main-viewport">
                <!-- 1. 主页 Tab -->
                <div class="line-tab-page active" id="tab-home">
                    <div class="line-home-header">
                        <div class="line-header-left btn-close-line-app" title="退出应用">
                            <i class="fa-solid fa-chevron-left"></i>
                        </div>
                        <div class="line-header-right">
                            <i class="fa-regular fa-bookmark"></i>
                            <i class="fa-regular fa-bell"></i>
                            <i class="fa-solid fa-user-plus"></i>
                            <i class="fa-solid fa-gear" id="btn-line-settings" title="账号与设置"></i>
                        </div>
                    </div>

                    <div class="line-profile-card" id="btn-edit-profile">
                        <div class="line-profile-info">
                            <div class="name" id="display-user-name">user</div>
                            <div class="status-msg" id="display-user-status">点击修改状态消息与人设</div>
                        </div>
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80" class="line-profile-avatar" id="display-user-avatar">
                    </div>

                    <div class="line-search-bar">
                        <span><i class="fa-solid fa-magnifying-glass"></i> 搜索</span>
                        <i class="fa-solid fa-qrcode"></i>
                    </div>

                    <div class="line-section">
                        <div class="line-section-title">
                            <span>服务</span>
                            <span class="more">显示全部</span>
                        </div>
                        <div class="line-services-grid">
                            <div class="line-service-item">

        <!-- 👤 修改个人资料 Modal -->

        <!-- ⚙️ 账号与系统设置 Modal -->

                <div class="settings-header">
                    <span>⚙️ 账号与 API 设置</span>

                <div class="setting-item">
                    <label>🔀 切换账号</label>

                <div class="setting-item"><label>已选 API</label><div class="input-group"><select id="select-saved-api"><option value="">-- 新建 API --</option></select><button class="btn-action" id="btn-new-api" style="background:#a39e9c;">+ 新建</button></div></div>

                </div>
                <div class="setting-item">
                    <label>手机全屏壁纸 URL</label>
                    <input type="text" id="input-bg-url" value="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYNKlqazeIwo7lHEctQ1m-4sA3EuR0tQACASwAAvjGWFc7gBC7Wy2V8D0E.jpeg">
                </div>
                <div class="setting-item">
                    <label>时钟卡片背景图片 URL</label>
                    <input type="text" id="input-widget-bg-url" value="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYNGRqazRcvjCr2kV4kbBc_xfLUfPldgACqCsAAvjGWFeIpTXSdcVZbD0E.jpeg">

        <div class="modal-overlay" id="modal-contacts">
            <div class="settings-card">
                <div class="settings-header">
                    <span>👥 通讯录</span>
                    <i class="fa-solid fa-xmark close-btn" id="btn-close-contacts"></i>
                </div>

                <div id="contact-list">
                    <!-- 动态渲染 -->
                </div>

                <div class="divider"></div>

                <div class="setting-item">
                    <label>好友名称</label>
                    <input id="friend-name" placeholder="例如：小樱">

                    <input id="friend-avatar" placeholder="图片地址">

                    <div class="input-group">

                        <button class="btn-action" id="generate-id">生成</button>

                <div class="setting-item">
                    <label>AI 人设</label>
                    <textarea id="friend-persona" placeholder="例如：温柔的日本女生，喜欢猫咪，说话慢慢的"></textarea>

                <button class="btn-save" id="save-friend">保存好友</button>
            </div>
        </div>

        <!-- 添加好友 Modal (LINE ID搜索) -->
        <div class="modal-overlay" id="modal-add-friend">
            <div class="settings-card">
                <div class="settings-header">
                    <span>➕ 添加好友</span>
                    <i class="fa-solid fa-xmark close-btn" id="close-add-friend"></i>
                </div>

                <div class="setting-item">
                    <label>输入 LINE ID</label>
                    <input id="search-line-id" placeholder="例如 LINE_AB12CD34">
                </div>

                <button class="btn-save" id="confirm-add-friend">搜索并添加</button>

                <div id="add-result" style="font-size:13px; text-align:center; color:#999;"></div>
            </div>
        </div>

    </div>

    <script>
        // ================================
        // 原有账号数据
        // ================================
        const accountsData = {
            'user': {
                name: 'user',
                status: '点击修改状态消息与人设',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80',
                persona: '我是 user。'
            },
            'sub_1': {
                name: '小号_喵喵',
                status: '小号测试中',
                avatar: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=120&auto=format&fit=crop&q=80',
                persona: ''
            }
        };

        let currentAccountKey = 'user';

        function renderProfile() {
            const acc = accountsData[currentAccountKey];
            document.getElementById('display-user-name').innerText = acc.name;
            document.getElementById('display-user-status').innerText = acc.status;
            document.getElementById('display-user-avatar').src = acc.avatar;

            document.getElementById('input-user-name').value = acc.name;
            document.getElementById('input-user-status').value = acc.status;
            document.getElementById('input-user-avatar').value = acc.avatar;
            document.getElementById('input-user-persona').value = acc.persona || '';
        }

        // ================================
        // 时间更新
        // ================================
        function updateRealTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('status-time').innerText = `${h}:${m}`;
            document.getElementById('widget-time').innerText = `${h}:${m}`;
        }
        setInterval(updateRealTime, 1000);
        updateRealTime();

        // ================================
        // 美化功能
        // ================================
        document.getElementById('btn-apply-theme').addEventListener('click', function() {
            const bgUrl = document.getElementById('input-bg-url').value;
            const widgetBgUrl = document.getElementById('input-widget-bg-url').value;
            const iconStyle = document.getElementById('select-icon-style').value;
            document.documentElement.style.setProperty('--bg-image-url', `url('${bgUrl}')`);
            document.documentElement.style.setProperty('--widget-bg-url', `url('${widgetBgUrl}')`);
            document.documentElement.style.setProperty('--app-icon-filter', iconStyle);
            document.getElementById('modal-theme').classList.remove('active');
        });

        document.getElementById('btn-reset-theme').addEventListener('click', function() {
            const defaultBg = "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYNKlqazeIwo7lHEctQ1m-4sA3EuR0tQACASwAAvjGWFc7gBC7Wy2V8D0E.jpeg";
            const defaultWidget = "https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEYNGRqazRcvjCr2kV4kbBc_xfLUfPldgACqCsAAvjGWFeIpTXSdcVZbD0E.jpeg";
            document.getElementById('input-bg-url').value = defaultBg;
            document.getElementById('input-widget-bg-url').value = defaultWidget;
            document.getElementById('select-icon-style').value = 'none';
            document.documentElement.style.setProperty('--bg-image-url', `url('${defaultBg}')`);
            document.documentElement.style.setProperty('--widget-bg-url', `url('${defaultWidget}')`);
            document.documentElement.style.setProperty('--app-icon-filter', 'none');
        });

        // ================================
        // 弹窗控制（原有的）
        // ================================
        document.getElementById('btn-line-settings').addEventListener('click', () => document.getElementById('modal-settings').classList.add('active'));
        document.getElementById('btn-edit-profile').addEventListener('click', () => document.getElementById('modal-profile').classList.add('active'));
        document.getElementById('btn-close-profile').addEventListener('click', () => document.getElementById('modal-profile').classList.remove('active'));
        document.getElementById('btn-open-settings').addEventListener('click', () => document.getElementById('modal-settings').classList.add('active'));
        document.getElementById('btn-close-settings').addEventListener('click', () => document.getElementById('modal-settings').classList.remove('active'));
        document.getElementById('btn-open-theme').addEventListener('click', () => document.getElementById('modal-theme').classList.add('active'));
        document.getElementById('btn-close-theme').addEventListener('click', () => document.getElementById('modal-theme').classList.remove('active'));

        // 保存个人资料
        document.getElementById('btn-save-profile').addEventListener('click', function() {
            const acc = accountsData[currentAccountKey];
            acc.name = document.getElementById('input-user-name').value;
            acc.status = document.getElementById('input-user-status').value;
            acc.avatar = document.getElementById('input-user-avatar').value;
            acc.persona = document.getElementById('input-user-persona').value;
            renderProfile();
            document.getElementById('modal-profile').classList.remove('active');
        });

        // 切换账号
        document.getElementById('select-account').addEventListener('change', function(e) {
            currentAccountKey = e.target.value;
            renderProfile();
        });

        // 新增小号
        document.getElementById('btn-add-account').addEventListener('click', function() {
            const newKey = 'sub_' + Date.now();
            accountsData[newKey] = {
                name: '新小号',
                status: '新账号',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=120&auto=format&fit=crop&q=80',
                persona: ''
            };
            const select = document.getElementById('select-account');
            const opt = document.createElement('option');
            opt.value = newKey;
            opt.innerText = `小号 ${Object.keys(accountsData).length}`;
            select.appendChild(opt);
            select.value = newKey;
            currentAccountKey = newKey;
            renderProfile();
        });

        // 退出 LINE
        document.querySelectorAll('.btn-close-line-app').forEach(btn => {
            btn.addEventListener('click', function() {
                document.getElementById('line-app').classList.remove('active');
            });
        });

        // 打开 LINE
        document.getElementById('btn-open-line').addEventListener('click', function() {
            document.getElementById('line-app').classList.add('active');
            document.getElementById('chat-room-page').style.display = 'none';
            document.getElementById('chat-list-page').style.display = 'flex';
            renderChatList();
        });

        // LINE 底部 Tab 切换
        document.querySelectorAll('.line-nav-item').forEach(item => {
            item.addEventListener('click', function() {
                const targetId = this.dataset.target;
                document.querySelectorAll('.line-nav-item').forEach(n => n.classList.remove('active'));
                document.querySelectorAll('.line-tab-page').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                const targetPage = document.getElementById(targetId);
                if (targetPage) targetPage.classList.add('active');
                if (targetId === 'tab-chat') {
                    document.getElementById('chat-room-page').style.display = 'none';
                    document.getElementById('chat-list-page').style.display = 'flex';
                    renderChatList();
                }
            });
        });

        // ================================
        // LINE AI 聊天 API 核心
        // ================================

        let currentChatFriend = null;

        function openChat(friend) {
            currentChatFriend = friend;
            document.getElementById('chat-list-page').style.display = 'none';
            document.getElementById('chat-room-page').style.display = 'flex';
            document.getElementById('chat-room-name').innerText = friend.name;
            document.getElementById('chat-messages').innerHTML = '';
        }

        document.getElementById('chat-back-btn').onclick = function() {
            document.getElementById('chat-room-page').style.display = 'none';
            document.getElementById('chat-list-page').style.display = 'flex';
            currentChatFriend = null;
        };

        function addChatMessage(text, type) {
            const box = document.createElement('div');
            box.className = 'chat-bubble ' + (type === 'user' ? 'chat-user' : 'chat-ai');
            box.innerText = text;
            document.getElementById('chat-messages').appendChild(box);
            document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
        }

        document.getElementById('chat-send-btn').onclick = async function() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();

            if (!message) return;
            if (!currentChatFriend) {
                alert('请选择好友');
                return;
            }

            input.value = '';
            addChatMessage(message, 'user');

            const apiURL = document.getElementById('api-url').value.trim();
            const apiKey = document.getElementById('api-key').value.trim();
            const model = document.getElementById('select-model').value.trim();

            if (!apiURL || !apiKey || !model) {
                addChatMessage('请先在设置中配置 API', 'ai');
                return;
            }

            const loading = document.createElement('div');
            loading.className = 'chat-loading';
            loading.innerText = '正在连接 API...';
            document.getElementById('chat-messages').appendChild(loading);

            try {
                const response = await fetch(apiURL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + apiKey
                    },
                    body: JSON.stringify({
                        model: model,
                        messages: [
                            { role: 'system', content: currentChatFriend.persona || '' },
                            { role: 'user', content: message }
                        ]
                    })
                });

                const data = await response.json();
                loading.remove();

                const reply = data.choices?.[0]?.message?.content;
                if (reply) {
                    addChatMessage(reply, 'ai');
                } else {
                    addChatMessage('API 没有返回内容', 'ai');
                }
            } catch (error) {
                loading.remove();
                addChatMessage('API连接失败', 'ai');
                console.error(error);
            }
        };

        document.getElementById('chat-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('chat-send-btn').click();
            }
        });

        // ================================
        // 通讯录好友系统
        // ================================

        let friends = JSON.parse(localStorage.getItem('friends') || '[]');

        // 打开通讯录
        document.getElementById('btn-open-contacts').onclick = function() {
            document.getElementById('modal-contacts').classList.add('active');
            renderFriends();
        };

        document.getElementById('btn-close-contacts').onclick = function() {
            document.getElementById('modal-contacts').classList.remove('active');
        };

        document.getElementById('generate-id').onclick = function() {
            let id = 'LINE_' + Math.random().toString(36).substring(2, 10).toUpperCase();
            document.getElementById('friend-id').value = id;
        };

        document.getElementById('save-friend').onclick = function() {
            const friend = {
                id: document.getElementById('friend-id').value || '',
                name: document.getElementById('friend-name').value || '未命名',
                avatar: document.getElementById('friend-avatar').value || '',
                persona: document.getElementById('friend-persona').value || ''
            };

            if (!friend.id) {
                alert('请生成ID');
                return;
            }

            friends.push(friend);
            localStorage.setItem('friends', JSON.stringify(friends));
            alert('好友添加成功');
            renderFriends();
            renderChatList();
            document.getElementById('friend-id').value = '';
            document.getElementById('friend-name').value = '';
            document.getElementById('friend-avatar').value = '';
            document.getElementById('friend-persona').value = '';
        };

        function renderFriends() {
            const box = document.getElementById('contact-list');
            box.innerHTML = '';
            friends.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'contact-item';
                item.innerHTML = `
                    <img src="${friend.avatar || 'https://via.placeholder.com/40'}" alt="${friend.name}">
                    <div class="info">
                        <div class="name">${friend.name}</div>
                        <div class="id">${friend.id}</div>
                    </div>
                `;
                box.appendChild(item);
            });
            if (friends.length === 0) {
                box.innerHTML = '<div style="padding:20px;text-align:center;color:#999;">暂无好友，添加一位吧</div>';
            }
        }

        function renderChatList() {
            const box = document.getElementById('friend-chat-list');
            box.innerHTML = '';

            if (friends.length === 0) {
                box.innerHTML = `
                    <div class="line-empty-state">
                        <div class="title">暂无聊天</div>
                        <div class="subtitle">请先添加好友</div>
                    </div>
                `;
                return;
            }

            friends.forEach(friend => {
                const item = document.createElement('div');
                item.className = 'friend-item';
                item.innerHTML = `
                    <img class="friend-avatar" src="${friend.avatar || 'https://via.placeholder.com/48'}" alt="${friend.name}">
                    <div class="friend-info">
                        <div class="friend-name">${friend.name}</div>
                        <div class="friend-last-msg">点击开始聊天</div>
                    </div>
                `;
                item.onclick = function() {
                    openChat(friend);
                };
                box.appendChild(item);
            });
        }

        // ================================
        // LINE ID 好友添加系统
        // ================================

        // 打开添加好友
        document.getElementById('btn-add-friend').onclick = function() {
            document.getElementById('modal-add-friend').classList.add('active');
            document.getElementById('add-result').innerText = '';
            document.getElementById('search-line-id').value = '';
        };

        // 关闭
        document.getElementById('close-add-friend').onclick = function() {
            document.getElementById('modal-add-friend').classList.remove('active');
        };

        // 搜索ID添加
        document.getElementById('confirm-add-friend').onclick = function() {
            const id = document.getElementById('search-line-id').value.trim();
            const result = document.getElementById('add-result');

            if (!id) {
                result.innerText = '请输入 LINE ID';
                return;
            }

            // 在所有好友库搜索 (包含本地 friends 数组)
            const target = friends.find(f => f.id === id);

            if (!target) {
                result.innerText = '❌ 未找到该好友';
                return;
            }

            // 检查是否已经存在 (用id去重)
            const exists = friends.some(f => f.id === target.id);
            if (exists) {
                result.innerText = '已经是好友';
                return;
            }

            friends.push(target);
            localStorage.setItem('friends', JSON.stringify(friends));
            result.innerText = '✅ 添加成功';
            renderFriends();
            renderChatList();
        };

        // ================================
        // 初始化渲染
        // ================================
        renderProfile();
        renderChatList();
        console.log('✅ LINE AI 聊天 + 通讯录 + ID添加已加载');
    </script>
</body>
</html>
